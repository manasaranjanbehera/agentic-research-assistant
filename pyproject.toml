[project]
name = "agentic-research-assistant"
version = "0.1.0"
description = "Multi-agent research & reporting assistant using AWS Bedrock"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Manasa Ranjan Behera", email = "manasabehera5901@gmail.com" },
]
keywords = ["aws", "bedrock", "agents", "multi-agent", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "boto3>=1.34",
]

[project.urls]
Homepage = "https://github.com/manasaranjanbehera/agentic-research-assistant"
Repository = "https://github.com/manasaranjanbehera/agentic-research-assistant"
Issues = "https://github.com/manasaranjanbehera/agentic-research-assistant/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
